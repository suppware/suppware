<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="/img/og-image.png">   
  <title>Registrarse - SUPP WARE</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo" style="display:block; margin-bottom:32px;">SUPP WARE</a>
      <h2>Crea tu cuenta</h2>
      <p class="subtitle">Únete y empieza a ganar puntos</p>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="regName" placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="regPhone" placeholder="871-xxx-xxxx">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="regPass" placeholder="Mínimo 8 caracteres">
      </div>
      <div class="form-group">
        <label>Dirección (Torreón)</label>
        <input type="text" id="regAddress" placeholder="Calle, número, colonia">
      </div>
      <button class="btn btn-primary" onclick="doRegister()">Crear Cuenta</button>
      <p class="auth-switch">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
