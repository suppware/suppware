<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="/img/og-image.png">   
  <title>Iniciar Sesión - SUPP WARE</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/" class="logo" style="display:block; margin-bottom:32px;">SUPP WARE</a>
      <h2>Bienvenido de nuevo</h2>
      <p class="subtitle">Inicia sesión para acceder a tu cuenta</p>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPass" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Iniciar Sesión</button>
      <p class="auth-switch">¿No tienes cuenta? <a href="/register.html">Regístrate</a></p>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
