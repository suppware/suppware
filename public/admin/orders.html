<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:image" content="/img/og-image.png">   
  <title>Pedidos - Admin</title>
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">  
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a href="/admin/" class="logo">SUPP WARE Admin</a>
      <ul class="admin-nav">
        <li><a href="/admin/">📊 Dashboard</a></li>
        <li><a href="/admin/products.html">📦 Productos</a></li>
        <li><a href="/admin/orders.html" class="active">🛒 Pedidos</a></li>
        <li><a href="/admin/users.html">👥 Usuarios</a></li>
      </ul>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1>Pedidos</h1>
        <select id="orderFilter" onchange="loadOrders()" style="padding:8px 14px;border-radius:var(--radius-sm);background:var(--bg-card);border:1px solid var(--border);color:var(--text-primary);">
          <option value="">Todos</option>
          <option value="pending">Pendiente</option>
          <option value="confirmed">Confirmado</option>
          <option value="shipped">Enviado</option>
          <option value="delivered">Entregado</option>
          <option value="cancelled">Cancelado</option>
        </select>
      </div>
      <div id="ordersList"></div>
    </main>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
